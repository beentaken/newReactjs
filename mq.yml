name: mq
version: "3.8"

networks:
  message-brokers:
    driver: bridge

services:
  ibmmq:
    image: ibmcom/mq:latest
    container_name: ibmmq
    restart: unless-stopped
    ports:
      - "1414:1414"
      - "9444:9443"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
      MQ_ADMIN_PASSWORD: admin123
    volumes:
      - ibmmq_data:/mnt/mqm/data
      - ibmmq_log:/mnt/mqm/log
    networks:
      - message-brokers
    deploy:
      resources:
        limits:
          memory: 1G

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"
      - "15675:15675"
      - "61613:61613"
      - "15674:15674"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: StrongPassword!
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./conf:/etc/rabbitmq
    networks:
      - message-brokers
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      bash -c "
        rabbitmq-plugins enable rabbitmq_mqtt rabbitmq_stomp rabbitmq_web_mqtt rabbitmq_web_stomp &&
        rabbitmq-server
      "
    deploy:
      resources:
        limits:
          memory: 512M

  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace
    restart: unless-stopped
    shm_size: 2g
    ports:
      - "8082:8080"
      - "1884:1883"
      - "8001:8000"
      - "55443:55443"
      - "1943:1943"
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
      - system_scaling_maxconnectioncount=100
    volumes:
      - solace_data:/var/lib/solace
    networks:
      - message-brokers
    ulimits:
      nofile:
        soft: 2448
        hard: 38048
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  ibmmq_data:
  ibmmq_log:
  rabbitmq_data:
  solace_data: