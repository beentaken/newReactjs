name: other
version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"   # HTTP UI
      - "9443:9443"   # HTTPS UI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    command: >
      --admin-password '$2y$05$Vv1z1n1ZbZxZbZxZbZxZbOeZbZxZbZxZbZxZbZxZbZxZbZxZb'
      --http-enabled
      --ssl=false

volumes:
  portainer_data: