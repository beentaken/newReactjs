version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      # Create admin account automatically
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=StrongP@ssw0rd123
    command: >
      --admin-password-file /run/secrets/admin_password

secrets:
  admin_password:
    file: ./admin_password.txt

volumes:
  portainer_data:
