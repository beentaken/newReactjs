name: reactapp-keycloak-mysql

version: '3.8'

services:
  webapi:
    build:
      context: ./webapi
      dockerfile: Dockerfile
    ports:
      - "7048:7048"
    networks:
      - keycloak-net

  webapp:
    build:
      context: ./reactapp
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - PORT=80
    networks:
      - keycloak-net

  mysql:
    image: mysql:8.0
    container_name: keycloak-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloakpassword
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount init script
      - ./dbscript/mysqlinit.sql:/docker-entrypoint-initdb.d/mysqlinit.sql:ro
      # Mount custom entrypoint
      - ./script/mysqlentrypoint.sh:/mysqlentrypoint.sh:ro
    entrypoint: ["/bin/bash", "/mysqlentrypoint.sh"]
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      # test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukeycloak", "-pkeycloakpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: keycloak-phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - mysql
    networks:
      - keycloak-net

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mydb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./dbscript/mongodbinit.js:/docker-entrypoint-initdb.d/mongodbinit.js:ro

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      # Mount init script
      - ./dbscript/mssqlinit.sql:/docker-entrypoint-initdb.d/mssqlinit.sql:ro
      # Mount custom entrypoint
      - ./script/mssqlentrypoint.sh:/mssqlentrypoint.sh:ro
    entrypoint: ["/bin/bash", "/mssqlentrypoint.sh"]
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: start-dev  # Remove for production
    restart: always
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - keycloak-net

volumes:
  mysql_data:
  mongodb_data:
  mssql_data:

networks:
  keycloak-net:
    driver: bridge
