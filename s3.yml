name: reactapp-keycloak-mysql

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: change-this-password

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    networks:
      - keycloak-net

volumes:
  minio_data:

networks:
  keycloak-net:
    driver: bridge